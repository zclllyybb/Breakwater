[project]
name = "breakwater"
version = "0.1.0"
description = "Local on-call agent service"
requires-python = ">=3.11"
dependencies = [
  "lark-oapi>=1.4.22",
  "pycryptodome>=3.23.0",
  "pyyaml>=6.0.3",
  "requests>=2.34.2",
  "websockets>=15.0.1",
]

[project.scripts]
breakwater = "breakwater.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["breakwater*"]
exclude = ["skills*"]

[dependency-groups]
dev = []
